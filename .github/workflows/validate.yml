name: validate

# Déclenché sur chaque push vers main et sur chaque pull request ciblant main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances de validation
        run: python -m pip install --requirement requirements-ci.txt

      - name: Valider les skills
        run: python scripts/validate_skills.py

      - name: Vérifier le schéma complet des banques d'évaluation
        run: python scripts/check_eval_configs.py

      # Une question de test recopiée du SKILL.md ne mesure plus l'effet du skill :
      # le modèle récite la réponse-type qu'il a sous les yeux.
      - name: Vérifier qu'aucune question de test n'est recopiée d'un skill
        run: python scripts/check_eval_leaks.py

      - name: Vérifier les cas d'activation et de non-déclenchement
        run: python scripts/check_activation_cases.py

      - name: Vérifier les preuves des skills promus ou modifiés en production
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_evidence.py --base "$BASE_SHA"

      - name: Vérifier qu'aucun .env n'est commité
        run: |
          if git ls-files eval/.env | grep -q .; then
            echo "[ERREUR] eval/.env est suivi par git"
            exit 1
          fi
          echo "[OK]     aucun .env commité"

      - name: Installer zip et générer les ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip
          ./build_release.sh

      - name: Vérifier la structure interne de chaque ZIP
        run: |
          erreur=0
          for zip_file in dist/*.zip; do
            nom=$(basename "$zip_file" .zip)
            # Vérifier que le ZIP contient bien <nom>/SKILL.md à sa racine
            if unzip -l "$zip_file" | grep -qE "^\s+[0-9].*\s${nom}/SKILL\.md$"; then
              echo "[OK]     $zip_file contient ${nom}/SKILL.md"
            else
              echo "[ERREUR] $zip_file ne contient PAS ${nom}/SKILL.md"
              echo "         Contenu du ZIP :"
              unzip -l "$zip_file"
              erreur=1
            fi
          done
          exit $erreur
