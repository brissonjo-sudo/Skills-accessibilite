name: validate

# Déclenché sur chaque push vers main et sur chaque pull request ciblant main.
# Appelé aussi par release.yml avant toute publication (workflow_call).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historique et tags complets : le contrôle des preuves compare à une base.
          fetch-depth: 0
          persist-credentials: false

      - name: Configurer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Installer les dépendances de validation
        run: python -m pip install --require-hashes --requirement requirements-ci.txt

      - name: Valider les skills
        run: python scripts/validate_skills.py

      - name: Vérifier le schéma complet des banques d'évaluation
        run: python scripts/check_eval_configs.py --require-node

      # Une question de test recopiée du SKILL.md ne mesure plus l'effet du skill :
      # le modèle récite la réponse-type qu'il a sous les yeux.
      - name: Vérifier qu'aucune question de test n'est recopiée d'un skill
        run: python scripts/check_eval_leaks.py

      - name: Vérifier les cas d'activation et de non-déclenchement
        run: python scripts/check_activation_cases.py

      # Base de comparaison : la base de la PR, le commit précédent sur main,
      # ou le tag précédent quand le workflow est appelé pour une release.
      - name: Vérifier les preuves des skills promus ou modifiés en production
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            base=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          else
            base="$EVENT_BASE"
          fi
          echo "Base de comparaison : ${base:-aucune}"
          python scripts/check_evidence.py --base "$base"

      # blinding_map.json lève l'aveuglement des juges ; eval/runs/ contient les
      # réponses brutes ; un .env peut contenir des clés.
      - name: Vérifier qu'aucun fichier sensible n'est commité
        run: |
          interdits=$(git ls-files | grep -E '(^|/)blinding_map\.json$|^eval/runs/|(^|/)\.env$' || true)
          if [ -n "$interdits" ]; then
            echo "[ERREUR] fichiers sensibles suivis par git :"
            echo "$interdits"
            exit 1
          fi
          echo "[OK]     aucun fichier sensible commité"

      - name: Générer les ZIP
        run: ./build_release.sh

      - name: Vérifier le contenu de chaque ZIP
        run: |
          erreur=0
          for zip_file in dist/*.zip; do
            nom=$(basename "$zip_file" .zip)
            contenu=$(unzip -Z1 "$zip_file")
            # Un ZIP contient exactement <nom>/SKILL.md, et rien d'autre.
            if [ "$contenu" = "${nom}/SKILL.md" ]; then
              echo "[OK]     $zip_file contient uniquement ${nom}/SKILL.md"
            else
              echo "[ERREUR] $zip_file : contenu inattendu"
              echo "$contenu"
              erreur=1
            fi
          done
          exit $erreur
