name: release

# Déclenché sur tout push d'un tag de la forme X.Y.Z (ex. 1.18.0).
on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Valider les skills
        run: python scripts/validate_skills.py

      - name: Installer zip et générer les ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip
          ./build_release.sh

      - name: Créer la GitHub Release et attacher les ZIP
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Release automatique des skills (ZIP importables)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
