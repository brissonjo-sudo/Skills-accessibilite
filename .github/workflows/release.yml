name: release

# Déclenché sur tout push d'un tag de la forme X.Y.Z, sans préfixe (ex. 1.19.0).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  # Toute la validation de la CI, rejouée sur le commit tagué : une release ne
  # peut pas publier un état que `validate` refuserait.
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Un tag posé sur un commit hors de main publierait du contenu jamais
      # relu. Les branches hotfix/* restent permises pour les correctifs à chaud.
      - name: Vérifier que le commit tagué est sur main ou sur une branche hotfix
        run: |
          branches=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)')
          if echo "$branches" | grep -qE '^origin/(main|hotfix/.+)$'; then
            echo "[OK]     commit présent sur : $(echo "$branches" | tr '\n' ' ')"
          else
            echo "[ERREUR] le commit $GITHUB_SHA n'est ni sur main ni sur une branche hotfix/*"
            exit 1
          fi

      - name: Configurer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Installer les dépendances de validation
        run: python -m pip install --require-hashes --requirement requirements-ci.txt

      - name: Générer les ZIP
        run: ./build_release.sh

      - name: Créer la GitHub Release et attacher les ZIP
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Release automatique des skills (ZIP importables)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
